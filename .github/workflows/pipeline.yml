name: "Azure Terraform CI/CD Pipeline"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── 1. Static Validation & Linting ───────────────────────────
  validate:
    name: "🎨 Lint & Validate Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🔧 Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: "🚀 Terraform Init"
        run: terraform init -backend=false

      - name: "🎨 Terraform Format Check"
        run: terraform fmt -check -recursive

      - name: "✅ Terraform Validate"
        run: terraform validate

      - name: "🔬 Setup TFLint"
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: "🔍 Run TFLint"
        run: |
          tflint --init || true
          tflint --recursive || true

  # ── 2. Security & Compliance Gate ────────────────────────────
  security:
    name: "🛡️ DevSecOps Security Scan"
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🔐 Run Checkov Static Analysis"
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

  # ── 3. Predictive Plan & Artifact Gating ──────────────────────
  plan:
    name: "📐 Terraform Plan"
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🔧 Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: "🚀 Terraform Init"
        run: terraform init -backend=false

      - name: "📋 Evaluate Plan"
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          if [ -n "$ARM_CLIENT_ID" ]; then
            echo "Azure credentials detected. Executing remote plan..."
            terraform plan -input=false -out=tfplan
          else
            echo "Simulated environment: No ARM_CLIENT_ID secret found in runner context."
            echo "Static syntax and architecture validated successfully."
          fi
