name: React CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReactTodoUIMonolith/package-lock.json

      - name: Install dependencies
        working-directory: ./ReactTodoUIMonolith
        run: npm ci

      - name: Build React application
        working-directory: ./ReactTodoUIMonolith
        run: npm run build

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ReactTodoUIMonolith/build

  deploy:
    name: Deploy to Azure
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: react-todo-1608
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./build